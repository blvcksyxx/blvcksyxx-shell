name: CI
on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -x install.sh install/lib/*.sh
      - name: Python scripts compile
        run: |
          for f in bin/*; do
            if head -n1 "$f" | grep -q python; then python3 -m py_compile "$f"; fi
          done
      - name: QML syntax
        run: |
          sudo apt-get install -y --no-install-recommends qt6-declarative-dev-tools
          # Ubuntu puts the Qt 6 tools in /usr/lib/qt6/bin, not on PATH
          QMLLINT=/usr/lib/qt6/bin/qmllint
          [ -x "$QMLLINT" ] || QMLLINT=qmllint
          "$QMLLINT" --version
          "$QMLLINT" $(git ls-files '*.qml')
      - name: Third-party downloads are pinned
        run: |
          if git grep -nE 'releases/latest|/latest/download' -- install.sh bin; then
            echo "Use an exact release/commit and a SHA-256, not a mutable latest URL." >&2
            exit 1
          fi
          git grep -q 'rice-download' -- install.sh bin/rice-fonts bin/rice-cursor
      - name: Verify signed commit on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --global gpg.ssh.allowedSignersFile "$PWD/install/trusted-signers"
          git verify-commit HEAD
      - name: License file
        run: |
          test -s LICENSE
          grep -q 'MIT License' LICENSE
          grep -q 'Permission is hereby granted' LICENSE
      - name: Installer dry run
        run: BLVCKSYXX_ALLOW_ROOT=1 ./install.sh --yes --dry-run

  platform-gate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: macOS is rejected with a clear message
        shell: bash
        run: |
          set +e
          output="$(./install.sh --dry-run --yes 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$output"
          test "$code" -eq 1
          printf '%s\n' "$output" | grep -q "macOS is not supported by blvcksyxx shell"
