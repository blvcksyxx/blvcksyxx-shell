# blvcksyxx shell - kitty terminal
# Colors come from the wallpaper (matugen writes current-theme.conf); the font is picked in
# Settings > Desktop > Look & Feel (font-set adds rice-font.conf); rice-effects adds rice-flat.conf.

include current-theme.conf
include rice-shell.conf

font_family JetBrainsMono Nerd Font
font_size 11

window_padding_width 10
background_opacity 0.6
confirm_os_window_close 0
enable_audio_bell no
scrollback_lines 10000
mouse_hide_wait 3.0
cursor_blink_interval 0.5

globinclude rice-flat.conf
