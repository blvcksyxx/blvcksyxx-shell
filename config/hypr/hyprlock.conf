# blvcksyxx shell lock screen. Generated by rice-lock (Settings > Idle & Lockscreen).

# Turn off 'Manage lock screen' there to keep your own file. (rice-lock.conf is not used)



background {
    monitor =
    path = @HOME@/Pictures/Wallpapers/grey-waves.jpg
    blur_passes = 3
    blur_size = 6
    brightness = 0.50
    contrast = 0.9
}

general {
    hide_cursor = false
}

label {
    monitor =
    text = cmd[update:10000] echo "<b>$(date +%H)</b>"
    color = rgba(212, 212, 212, 0.95)
    font_size = 120
    font_family = Unbounded
    position = 110, 250
    halign = left
    valign = center
}

label {
    monitor =
    text = cmd[update:10000] echo "$(date +%M)"
    color = rgba(212, 212, 212, 0.55)
    font_size = 120
    font_family = Unbounded
    position = 110, 118
    halign = left
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date '+%A, %d %B'
    color = rgba(255, 255, 255, 0.55)
    font_size = 18
    font_family = Google Sans Flex
    position = 110, 30
    halign = left
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] @HOME@/.local/bin/rice-lock greet
    color = rgba(255, 255, 255, 0.90)
    font_size = 15
    font_family = Google Sans Flex
    position = 110, -6
    halign = left
    valign = center
}

input-field {
    monitor =
    size = 300, 52
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true
    font_color = rgb(230, 230, 230)
    check_color = rgba(212, 212, 212, 0.60)
    fail_color = rgba(220, 80, 80, 0.6)
    fade_on_empty = false
    font_family = Google Sans Flex
    placeholder_text = <span foreground="##ffffff77">Enter password</span>
    outline_thickness = 0
    rounding = -1
    inner_color = rgba(255, 255, 255, 0.08)
    position = 110, -96
    halign = left
    valign = center
}

label {
    monitor =
    text = <span>󰍃 </span>
    color = rgba(255, 255, 255, 0.60)
    font_size = 30
    font_family = Google Sans Flex
    onclick = @HOME@/.local/bin/logout
    position = 110, -190
    halign = left
    valign = center
}

label {
    monitor =
    text = <span>󰐥 </span>
    color = rgba(255, 255, 255, 0.60)
    font_size = 30
    font_family = Google Sans Flex
    onclick = $HOME/.local/bin/rice-sys poweroff
    position = 200, -190
    halign = left
    valign = center
}

label {
    monitor =
    text = <span>󰤄 </span>
    color = rgba(255, 255, 255, 0.60)
    font_size = 30
    font_family = Google Sans Flex
    onclick = $HOME/.local/bin/rice-sys suspend
    position = 290, -190
    halign = left
    valign = center
}

label {
    monitor =
    text = <span>󰜉 </span>
    color = rgba(255, 255, 255, 0.60)
    font_size = 30
    font_family = Google Sans Flex
    onclick = $HOME/.local/bin/rice-sys reboot
    position = 380, -190
    halign = left
    valign = center
}

label {
    monitor =
    text = cmd[update:1500] @HOME@/.local/bin/rice-lock media
    color = rgba(255, 255, 255, 0.75)
    font_size = 14
    font_family = Google Sans Flex
    position = 110, 40
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:3000] @HOME@/.local/bin/rice-sysline
    color = rgba(255, 255, 255, 0.75)
    font_size = 14
    font_family = Google Sans Flex
    position = 110, 72
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:600000] @HOME@/.local/bin/rice-lock weather
    color = rgba(255, 255, 255, 0.75)
    font_size = 14
    font_family = Google Sans Flex
    position = 110, 104
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:3000] @HOME@/.local/bin/rice-lock notif
    color = rgba(255, 255, 255, 0.75)
    font_size = 14
    font_family = Google Sans Flex
    position = 110, 136
    halign = left
    valign = bottom
}
